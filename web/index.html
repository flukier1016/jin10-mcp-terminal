<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <meta name="description" content="基于标准 MCP 协议接入金十数据的实时财经终端 —— 行情、K线、快讯、资讯、财经日历" />
    <title>金十实时终端 · JIN10 MCP TERMINAL</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e16'/%3E%3Cpath d='M8 22V10h3v9h6v3H8z' fill='%23f5b544'/%3E%3Ccircle cx='23' cy='12' r='3' fill='%23e5484d'/%3E%3C/svg%3E" />
  </head>
  <body>
    <script>
      // 在 React 挂载前定好主题，避免首屏闪白/闪黑
      (function () {
        try {
          var t = localStorage.getItem('jin10.theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var r = document.documentElement;
          r.dataset.theme = t;
          r.dataset.scheme = localStorage.getItem('jin10.scheme') === 'western' ? 'western' : 'cn';
          document.documentElement.style.background = t === 'light' ? '#eef1f6' : '#05070c';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
